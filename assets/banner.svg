<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Claude Design God Mode: one plugin that makes any website, CRM, landing page or game look significantly better">
  <style>
    .d { font-family: Archivo, "Arial Black", "Helvetica Neue", Arial, sans-serif; }
    .b { font-family: "Public Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
    @keyframes drop { 0%, 12% { opacity: 0; transform: translateY(-22px); } 26%, 100% { opacity: 1; transform: none; } }
    .drop { animation: drop 6s cubic-bezier(.23,1,.32,1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .25; } }
    .live { animation: blink 1.6s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .drop, .live { animation: none; } }
  </style>
  <rect width="1280" height="360" fill="#F1F2EE"/>
  <rect x="0" y="0" width="1280" height="8" fill="#F5A30A"/>

  <!-- Wordmark -->
  <rect x="64" y="70" width="34" height="34" rx="4" fill="#F5A30A" stroke="#15212B" stroke-width="5"/>
  <text x="114" y="99" class="b" font-size="20" font-weight="600" fill="#56636E">Claude</text>
  <text x="64" y="186" class="d" font-size="76" font-weight="900" fill="#15212B" letter-spacing="-2">Design</text>
  <text x="64" y="262" class="d" font-size="76" font-weight="900" fill="#56636E" letter-spacing="-2">God Mode</text>
  <text x="66" y="312" class="b" font-size="21" fill="#15212B">Nine design skills. One command. Any frontend, visibly better.</text>

  <!-- Before tile -->
  <g transform="translate(700 64)">
    <text x="0" y="-12" class="b" font-size="14" font-weight="600" fill="#56636E">Before</text>
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
    <rect width="220" height="232" rx="10" fill="url(#g)" opacity=".55"/>
    <rect x="40" y="70" width="140" height="14" rx="3" fill="#fff" opacity=".9"/>
    <rect x="60" y="94" width="100" height="8" rx="3" fill="#fff" opacity=".6"/>
    <rect x="62" y="122" width="44" height="18" rx="6" fill="#fff"/>
    <rect x="114" y="122" width="44" height="18" rx="6" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="50" cy="196" r="14" fill="#fff" opacity=".5"/><circle cx="110" cy="196" r="14" fill="#fff" opacity=".5"/><circle cx="170" cy="196" r="14" fill="#fff" opacity=".5"/>
  </g>

  <!-- Arrow -->
  <path d="M938 180 h28 m-10 -10 l10 10 l-10 10" stroke="#15212B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- After tile: dispatch board -->
  <g transform="translate(984 64)">
    <text x="0" y="-12" class="b" font-size="14" font-weight="600" fill="#15212B">After</text>
    <rect width="232" height="232" rx="10" fill="#FFFFFF" stroke="#D5D8D0"/>
    <text x="14" y="28" class="d" font-size="15" font-weight="800" fill="#15212B">Every crew.</text>
    <text x="14" y="46" class="d" font-size="15" font-weight="800" fill="#56636E">One board.</text>
    <rect x="160" y="18" width="58" height="20" rx="4" fill="#F5A30A"/>
    <line x1="0" y1="62" x2="232" y2="62" stroke="#D5D8D0"/>
    <g font-size="9" class="b" fill="#56636E">
      <rect x="14" y="76" width="70" height="26" rx="3" fill="#E7EFF8"/><rect x="14" y="76" width="3" height="26" fill="#2B6CB0"/>
      <rect x="150" y="76" width="68" height="26" rx="3" fill="#E7EFF8"/><rect x="150" y="76" width="3" height="26" fill="#2B6CB0"/>
      <g class="drop"><rect x="90" y="76" width="54" height="26" rx="3" fill="#FBE4E4"/><rect x="90" y="76" width="3" height="26" fill="#C53030"/></g>
      <rect x="14" y="112" width="100" height="26" rx="3" fill="#E3F1E8"/><rect x="14" y="112" width="3" height="26" fill="#2F855A"/>
      <rect x="124" y="112" width="60" height="26" rx="3" fill="#E3F1E8"/><rect x="124" y="112" width="3" height="26" fill="#2F855A"/>
      <rect x="44" y="148" width="120" height="26" rx="3" fill="#FDF0D5"/><rect x="44" y="148" width="3" height="26" fill="#F5A30A"/>
      <rect x="24" y="184" width="64" height="26" rx="3" fill="#E7EFF8"/><rect x="24" y="184" width="3" height="26" fill="#2B6CB0"/>
      <rect x="100" y="184" width="104" height="26" rx="3" fill="#E7EFF8"/><rect x="100" y="184" width="3" height="26" fill="#2B6CB0"/>
    </g>
    <line x1="96" y1="66" x2="96" y2="222" stroke="#C53030" stroke-width="2"/>
    <circle class="live" cx="96" cy="68" r="4" fill="#C53030"/>
  </g>
</svg>
